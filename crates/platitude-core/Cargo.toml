[package]
name = "platitude-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core logic for platitude-gg: git subprocess execution, output parsing, domain model. Qt-free."

[dependencies]
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tokio-util.workspace = true
tracing.workspace = true
# Author pictures (`picture`). Pure Rust, no build script wanting a C
# compiler; flate2's `any_c_zlib` backends would link a C zlib (png's
# `zlib-rs` feature picks the Rust port).
png = "0.18"
zune-jpeg = "0.5"
zune-core = "0.5"
compact_str = { version = "0.10.0", default-features = false, features = ["std"] }
smallvec = { version = "1.15.2", features = ["union"] }
# Syntax colours, the fast path (`highlight::grammar`), an order of
# magnitude over the regex lexer: tree-sitter and a grammar crate per
# language. Their C build scripts are a user-approved exception (Qt
# already demands a C++ compiler; the parsers ship as generated C).
# syntect below covers languages with no grammar crate.
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cmake = "0.7"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-diff = "0.1"
tree-sitter-elixir = "0.3"
tree-sitter-go = "0.25"
tree-sitter-haskell = "0.23"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
# No highlight query shipped, so ours is in `highlight/queries/`. fwcd's
# crate has one but links a second tree-sitter C runtime (LNK1169).
tree-sitter-kotlin-ng = "1.1"
tree-sitter-lua = "0.5"
tree-sitter-md = "0.5"
tree-sitter-nix = "0.3"
tree-sitter-objc = "3.0"
tree-sitter-ocaml = "0.26"
tree-sitter-php = "0.24"
tree-sitter-powershell = "0.26"
tree-sitter-properties = "0.3"
tree-sitter-python = "0.25"
tree-sitter-qmljs = "0.3"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-sequel = "0.3"
tree-sitter-swift = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-xml = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-zig = "1.1"
# The regex fallback. `regex-fancy`: the default Oniguruma's Regex is not
# Send, so it could not leave the UI's runtime.
syntect = { version = "5.3", default-features = false, features = [
    "parsing",
    "regex-fancy",
    "dump-load",
    "default-syntaxes",
] }
# The fallback languages Sublime's own set leaves out.
two-face = { version = "0.5", default-features = false, features = [
    "syntect-fancy",
] }
# Test mocks as an attribute on a read that asks the machine
# (`conflict::available_tools`), with no seam in the code. The mock half
# is in debug builds only.
mry = "0.14"

[dev-dependencies]
insta = "1"
tempfile = "3"
# The paused clock for `session::auto_fetch`'s interval tests. No new
# crate, and a dev-dependency's features stay out of non-test builds.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
