[package]
name = "platitude-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core logic for platitude-gg: git subprocess execution, output parsing, domain model. Qt-free."

[dependencies]
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tokio-util.workspace = true
tracing.workspace = true
# Reading and rewriting the pictures a person assigns to an author
# (`picture`). Pure Rust and no build script that wants a C compiler, so
# the three-OS build and the offline job stay as they are. What would
# pull one in sits a level down, in flate2: the backends under its
# `any_c_zlib` (`zlib`, `zlib-ng`, `cloudflare_zlib`) link a C zlib
# through libz-sys or libz-ng-sys. png's `zlib-rs` feature picks
# flate2's Rust port.
png = "0.18"
zune-jpeg = "0.5"
zune-core = "0.5"
compact_str = { version = "0.10.0", default-features = false, features = ["std"] }
smallvec = { version = "1.15.2", features = ["union"] }
# Syntax colours, the fast path (`highlight::grammar`): tree-sitter and
# one grammar crate per language. Licenses surveyed on crates.io
# 2026-08-23: every grammar below is MIT except Elixir (Apache-2.0) —
# both in the allowed set. These carry C build scripts — a user-approved
# exception: the toolchain already demands a C++ compiler for Qt, the
# parsers ship as generated C inside the crates (offline-friendly), and
# the measured order-of-magnitude win over the regex lexer is what makes
# the first paint immediate. syntect below stays as the fallback for
# languages with no grammar crate.
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cmake = "0.7"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-diff = "0.1"
tree-sitter-elixir = "0.3"
tree-sitter-go = "0.25"
tree-sitter-haskell = "0.23"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
# Its crate ships the parser but no highlight query (and fwcd's crate,
# which has one upstream, drags in a second tree-sitter C runtime —
# LNK1169), so the query is hand-written in `highlight/queries/`.
tree-sitter-kotlin-ng = "1.1"
tree-sitter-lua = "0.5"
tree-sitter-md = "0.5"
tree-sitter-nix = "0.3"
tree-sitter-objc = "3.0"
tree-sitter-ocaml = "0.26"
tree-sitter-php = "0.24"
tree-sitter-powershell = "0.26"
tree-sitter-properties = "0.3"
tree-sitter-python = "0.25"
tree-sitter-qmljs = "0.3"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-sequel = "0.3"
tree-sitter-swift = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-xml = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-zig = "1.1"
# The regex-based fallback (`highlight` outside `grammar`), for
# languages with no grammar crate above. fancy-regex: syntect's default
# Oniguruma has a Regex that is not Send, so it could not leave the
# UI's runtime at all.
syntect = { version = "5.3", default-features = false, features = [
    "parsing",
    "regex-fancy",
    "dump-load",
    "default-syntaxes",
] }
# The fallback languages Sublime's own set leaves out.
two-face = { version = "0.5", default-features = false, features = [
    "syntect-fancy",
] }
# Mocks for the daily tests: an attribute on a read that asks the machine
# rather than the repository (`conflict::available_tools`), so a test
# stands its own machine in for it without a seam in the code. The mock
# half is built into debug builds only; a release carries the function as
# written. Licenses surveyed on crates.io 2026-09-23: mry, mry_macros and
# the rest are MIT OR Apache-2.0 except darling / strsim (MIT) and
# unicode-ident ((MIT OR Apache-2.0) AND Unicode-3.0) — all in the
# allowed set.
mry = "0.14"

[dev-dependencies]
insta = "1"
tempfile = "3"
# The paused clock the auto-fetch timer's tests judge the interval on
# (`session::auto_fetch`). A feature of the tokio already depended on —
# no crate of its own and no license to weigh — and a dev-dependency's
# features do not reach a build that is not a test.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
