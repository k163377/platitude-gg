<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="Platitude GG">
  <title>Platitude GG</title>
  <!--
    The 16-20px cut of platitude.svg, on the same four tokens and in the
    same arrangement — the small size is meant to read as the same mark,
    not as a second one.

    So the commit nodes stay. They are drawn thinner than the master's
    (2.1x the stroke against 2.2x) and the whole figure is pulled in from
    the tile, but dropping them entirely turns the trunk into a bare bar
    and the icon stops looking like the big one.

    The trunk is drawn last so it passes over the branch where they meet:
    at this size the other order breaks the trunk into two pieces.

    Coordinates sit on half-pixels so a 1px frame lands on whole device
    pixels at 100% scaling instead of being smeared across two rows.
  -->
  <rect x="0.5" y="0.5" width="15" height="15" rx="3.5" fill="#0F172A" stroke="#475569"/>
  <path d="M11 6.6C11 9.6 8.6 9.6 6.2 10.9" fill="none" stroke="#E69F00" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="11" cy="5.4" r="1.7" fill="#E69F00"/>
  <path d="M5 4.6V11.4" fill="none" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="5" cy="4.3" r="1.9" fill="#3B82F6"/>
  <circle cx="5" cy="11.7" r="1.9" fill="#3B82F6"/>
</svg>
