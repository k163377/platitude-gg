<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="Platitude GG">
  <title>Platitude GG</title>
  <!--
    Two commit lanes on the app's own surface: a trunk, and a branch that
    forks off and merges back into it. This is what the window shows when
    it opens, at the smallest size that still reads as a graph.

    Every value is a Theme token (デザイン規約 §色) — none of it is tuned
    by eye:
      tile   bgElevated    #0F172A
      frame  borderStrong  #475569
      trunk  accent        #3B82F6
      branch graphLane[1]  #E69F00

    The frame is not decoration. bgElevated is 1.10:1 over the Windows dark
    taskbar and 1.04:1 over the Ubuntu dock, so without it the icon has no
    outline there; borderStrong carries 2.15:1 on Windows dark and 2.46:1
    on the Ubuntu dock. The dark tile is what carries the light side
    (16.09:1 over a light taskbar), where the strokes alone would sink.

    The branch is a lane color rather than warning, danger or refTag: those
    name a state or a kind inside the UI, and worn by the icon for good
    they would mean less there. Lane colors name nothing.

    The branch is drawn first and the trunk over it, in both cuts: the
    other order breaks the trunk in two where they meet.

    The drawing is the app's own: the strokes and nodes redraw NavIcon's
    branch mark. Not git's official logo (it comes with a CC BY 3.0
    attribution), nor any other git client's shape.

    Drawn for 24px and up. At 16-20px use platitude-16.svg.
  -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0F172A" stroke="#475569" stroke-width="3"/>
  <path d="M44 24C44 39 33 38 24 43" fill="none" stroke="#E69F00" stroke-width="5" stroke-linecap="round"/>
  <circle cx="44" cy="19" r="5.5" fill="#E69F00"/>
  <path d="M20 16V48" fill="none" stroke="#3B82F6" stroke-width="5" stroke-linecap="round"/>
  <circle cx="20" cy="14" r="5.5" fill="#3B82F6"/>
  <circle cx="20" cy="50" r="5.5" fill="#3B82F6"/>
</svg>
