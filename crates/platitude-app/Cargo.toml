# The QML-facing application crate. Bridge layer stays thin (実装計画 §2.1):
# it only maps platitude-core results onto QML models/properties so that a
# later Qt Bridges -> CXX-Qt swap is contained here.
[package]
name = "platitude-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "platitude-gg: a thin, fast git GUI driving the system git CLI"

[[bin]]
name = "platitude-gg"
path = "src/main.rs"

[dependencies]
platitude-core.workspace = true
qtbridge = "0.2"
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber = "0.3"

[lints]
workspace = true
