# The QML-facing application crate. Bridge layer stays thin (実装計画 §2):
# it only maps platitude-core results onto QML models/properties so that a
# later Qt Bridges -> CXX-Qt swap is contained here.
[package]
name = "platitude-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "platitude-gg: a thin, fast git GUI driving the system git CLI"

[[bin]]
name = "platitude-gg"
path = "src/main.rs"

[features]
# Builds the verification harness in (src/harness + the `platitude.auto`
# QML module): the `PGG_*` protocol `cargo xtask verify-ui`, `cargo xtask
# perf` and the screenshot runs drive the app over. Off in a shipped
# build, which is what `cargo build --release` gives you — every xtask
# that drives the app asks for it back.
automation = []
# Installs the counting global allocator (src/harness/memprobe.rs) so a run
# can say how much of its footprint is Rust heap. Off in a shipped build:
# the two atomics per allocation exist only to be measured.
memprobe = []

[dependencies]
platitude-core.workspace = true
qtbridge = "0.2"
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
# The stderr subscriber (`init_tracing`). Two of the default features
# have no caller here. `ansi`: that stream is never coloured, and
# `with_ansi(false)` stays callable without the feature — which is the
# documented way to make the escapes impossible. `tracing-log`: nothing
# in the tree logs through `log`, and that feature is what makes
# `init()` install the `log` bridge, so a dependency that logs that way
# goes unheard until it is back on. Off, the two take three crates with
# them (measured: nu-ansi-term, tracing-log, log — 16KB off the shipped
# binary).
tracing-subscriber = { version = "0.3", default-features = false, features = ["smallvec", "fmt", "std"] }

[lints]
workspace = true
