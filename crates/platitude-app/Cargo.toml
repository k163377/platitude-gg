[package]
name = "platitude-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "platitude-gg: a thin, fast git GUI driving the system git CLI"

[[bin]]
name = "platitude-gg"
path = "src/main.rs"

[features]
# The verification harness (src/harness + the `platitude.auto` QML module)
# that reads the `PGG_*` knobs. Off in a shipped build; every xtask that
# drives the app turns it on.
automation = []
# The counting global allocator (src/harness/memprobe.rs): the Rust heap's
# share of a run's footprint. Off in a shipped build — two atomics per
# allocation.
memprobe = []

[dependencies]
platitude-core.workspace = true
qtbridge = "0.2"
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
# The stderr subscriber (`init_tracing`), minus two defaults. `ansi`: the
# stream is never coloured (`with_ansi(false)` compiles without it).
# `tracing-log`: nothing here logs through `log`; a dependency that does
# goes unheard until it is back on.
tracing-subscriber = { version = "0.3", default-features = false, features = ["smallvec", "fmt", "std"] }

[lints]
workspace = true
