# internal-docs/実装計画.md §11.1 (disallowed-types).
too-many-lines-threshold = 100
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

disallowed-types = [
    { path = "std::net::TcpStream", reason = "the app must never open a socket; network I/O happens only inside the git CLI subprocess" },
    { path = "std::net::TcpListener", reason = "the app must never open a socket; network I/O happens only inside the git CLI subprocess" },
    { path = "std::net::UdpSocket", reason = "the app must never open a socket; network I/O happens only inside the git CLI subprocess" },
    { path = "tokio::net::TcpStream", reason = "the app must never open a socket; network I/O happens only inside the git CLI subprocess" },
    { path = "tokio::net::TcpListener", reason = "the app must never open a socket; network I/O happens only inside the git CLI subprocess" },
    { path = "tokio::net::TcpSocket", reason = "the app must never open a socket; network I/O happens only inside the git CLI subprocess" },
    { path = "tokio::net::UdpSocket", reason = "the app must never open a socket; network I/O happens only inside the git CLI subprocess" },
]

disallowed-methods = [
    { path = "tokio::net::lookup_host", reason = "the app must never resolve a host name; network I/O happens only inside the git CLI subprocess" },
]
