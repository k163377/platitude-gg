# The cargo side of CI, for the workflows that start it (light.yml,
# full.yml): build + test + lint on the runners named, and in the full set
# the dependency policy.
# Nothing is pinned here: Qt's version is .qt-version's and the toolchain is
# rust-toolchain.toml's, so an edit to this file changes nothing the gate
# builds or keys a step by.
# The file keeps its name: the commits from before .qt-version pin Qt in
# it, and xtask reads them there (`qt::former_pin`).
name: Checks (called by Light and Full)

on:
  workflow_call:
    inputs:
      # Named, not -latest: a new OS release arrives as a commit to a
      # caller. What an image carries (its compilers, its git) still moves
      # under the name. Ubuntu's is the release ci/linux/Dockerfile's UBUNTU
      # names, and `cargo xtask versions` holds every runner name of an OS
      # to one.
      os:
        description: "the runners, as a JSON list"
        type: string
        required: true
      full:
        description: "fmt, the periodic tests, the shipped build and the dependency policy besides clippy and the tests"
        type: boolean
        required: true

permissions:
  contents: read

# One shell on all three: fail-fast, and what the desks run the suite under.
defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml names the version; the image's own toolchains
      # are left as they are.
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libxkbcommon-dev
      - name: Qt
        uses: ./.github/actions/qt
      # After Qt: QMAKE names the Qt the builds are made against, version
      # and all, so it is part of the key — a new Qt starts a new cache
      # instead of rebuilding over the old one on every run.
      # Only main writes the cache, and a red run still does — the build it
      # kept is what the next run starts from. The light and the full set
      # keep one each: the job's id is the same for both callers, and the
      # one saved first would otherwise be the only one ever kept.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ inputs.full && 'full' || 'light' }}
          env-vars: QMAKE
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # On the record: the git is the image's own, not the oldest one
      # supported (internal-docs/P5-確認事項.md §6).
      - name: What this run builds and tests with
        run: |
          rustc --version
          git --version
          qmake -query QT_VERSION

      # Not in the light set: land's gate has run it on every commit, and
      # no OS formats differently.
      - name: Format check
        if: ${{ inputs.full }}
        run: cargo fmt --all --check
      # --all-features: nothing else here compiles automation / memprobe
      # (both off by default); Test compiles the default set.
      # --locked on every cargo here, as in the gate: the graph checked is
      # the committed Cargo.lock.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      # The tests no daily tier runs: each sits in a `periodic` module,
      # #[ignore]d so no plain run takes it (.claude/rules-refs/core.md
      # `periodic`).
      - name: Periodic tests
        if: ${{ inputs.full }}
        run: cargo test --locked --workspace -- --ignored '::periodic::'
      # Only the build without the harness can fail to load its QML: a
      # platitude.auto type named in platitude.ui resolves in every other
      # build. No display needed — the command sets QT_QPA_PLATFORM itself.
      - name: Shipped build loads its QML
        if: ${{ inputs.full }}
        run: cargo run --locked -p xtask -- shipped

  # The only place the advisories are read (`cargo xtask deny` checks the
  # other three offline), so a red here may be RustSec's news, not the
  # tree's.
  deny:
    if: ${{ inputs.full }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      # `check` with no argument runs all four; advisories pull the RustSec DB
      # from github.com.
      - name: cargo-deny (advisories / bans / licenses / sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # The action's default, plus --locked.
          arguments: --all-features --locked
