# 3-OS build + test + lint under an egress allowlist, a fully-offline test
# job (internal-docs/実装計画.md §11.3) and the dependency policy.
# Nothing is pinned here: Qt's version is .qt-version's and the toolchain is
# rust-toolchain.toml's, so an edit to this file changes nothing the gate
# builds or keys a step by.
name: CI

# A change that is Markdown alone starts nothing, as it selects no test in
# the gate.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push replaces its older run. A push to main is a
# group of its own: one shared by every push would drop the runs still
# queued behind the one running.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# One shell on all three: fail-fast, and what the desks run the suite under.
defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Named, not -latest: a new OS release arrives as a commit here. What
        # an image carries (its compilers, its git) still moves under the
        # name. Ubuntu's is the release ci/linux/Dockerfile's UBUNTU names,
        # and `cargo xtask versions` holds every runner name of an OS to one.
        os:
          - &ubuntu ubuntu-24.04
          - windows-2025
          - macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      # The last five are where the certificates of github.com and crates.io
      # say their revocation is asked after. Windows asks, for git and for
      # cargo, and cargo refuses a certificate it could not ask about
      # (http.check-revoke) once what the image has cached of the answers
      # runs out. A site that changes its authority changes these.
      - &harden
        name: Harden runner (egress allowlist)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            pypi.org:443
            files.pythonhosted.org:443
            master.qt.io:443
            download.qt.io:443
            azure.archive.ubuntu.com:80
            archive.ubuntu.com:80
            security.ubuntu.com:80
            ocsp.sectigo.com:80
            crl.sectigo.com:80
            ocsp.globalsign.com:80
            ocsp2.globalsign.com:80
            crl.globalsign.com:80
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml names the version; the image's own toolchains
      # are left as they are.
      - &rust
        name: Rust toolchain
        run: rustup toolchain install --no-self-update
      - &linux-deps
        name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libxkbcommon-dev
      - &qt
        name: Qt
        uses: ./.github/actions/qt
      # After Qt: QMAKE names the Qt the builds are made against, version
      # and all, so it is part of the key — a new Qt starts a new cache
      # instead of rebuilding over the old one on every run.
      # Only main writes the cache, and a red run still does — the build it
      # kept is what the next run starts from.
      - &rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          env-vars: QMAKE
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # On the record: the git is the image's own, not the oldest one
      # supported (internal-docs/P5-確認事項.md §6).
      - &versions
        name: What this run builds and tests with
        run: |
          rustc --version
          git --version
          qmake -query QT_VERSION

      - name: Format check
        run: cargo fmt --all --check
      # --all-features: nothing else here compiles automation / memprobe
      # (both off by default); Test compiles the default set.
      # --locked on every cargo here, as in the gate: the graph checked is
      # the committed Cargo.lock.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      # Only the build without the harness can fail to load its QML: a
      # platitude.auto type named in platitude.ui resolves in every other
      # build. No display needed — the command sets QT_QPA_PLATFORM itself.
      - name: Shipped build loads its QML
        run: cargo run --locked -p xtask -- shipped

  # All tests and an offscreen app smoke, inside an empty network namespace
  # (internal-docs/実装計画.md §11.3).
  offline-test:
    runs-on: *ubuntu
    timeout-minutes: 120
    steps:
      - *harden
      - *checkout
      - *rust
      - *linux-deps
      - *qt
      - *rust-cache
      - *versions

      # Build online, run offline. The smoke needs the harness feature
      # (xtask HARNESS_FEATURE; ci/offline-test.sh).
      - name: Build test binaries and app
        run: |
          cargo build --locked -p platitude-app --features automation
          cargo test --locked --workspace --no-run
      - name: Run tests in an empty network namespace
        run: |
          mapfile -t BINS < <(cargo test --locked --workspace --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true) | .executable | select(. != null)')
          echo "collected ${#BINS[@]} test binaries"
          sudo -E env "PATH=${PATH}" "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" \
            PGG_SMOKE_BIN="$(pwd)/target/debug/platitude-gg" \
            unshare -n bash ci/offline-test.sh "${BINS[@]}"

  deny:
    runs-on: *ubuntu
    timeout-minutes: 15
    steps:
      # static.rust-lang.org: the action's container installs what
      # rust-toolchain.toml names before it runs cargo-deny.
      - name: Harden runner (egress allowlist)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
      - *checkout
      # `check` with no argument runs all four; advisories pull the RustSec DB
      # from github.com.
      - name: cargo-deny (advisories / bans / licenses / sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # The action's default, plus --locked.
          arguments: --all-features --locked
