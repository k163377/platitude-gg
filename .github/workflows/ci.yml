# 3-OS build + test + lint with egress control, plus a fully-offline test
# job (internal-docs/実装計画.md §11.3). QT_VERSION is pinned here: CI is the
# toolchain's lockfile.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  QT_VERSION: "6.10.3"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            qt_host: linux
            qt_arch: linux_gcc_64
            qt_dir: gcc_64
          - os: windows-latest
            qt_host: windows
            qt_arch: win64_msvc2022_64
            qt_dir: msvc2022_64
          - os: macos-latest
            qt_host: mac
            qt_arch: clang_64
            qt_dir: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden runner (egress allowlist)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            pypi.org:443
            files.pythonhosted.org:443
            download.qt.io:443
            azure.archive.ubuntu.com:80
            archive.ubuntu.com:80
            security.ubuntu.com:80
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libxkbcommon-dev
      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qt
          key: qt-${{ env.QT_VERSION }}-${{ matrix.qt_arch }}
      - name: Install Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: bash
        run: |
          pip install aqtinstall
          # --base pins the primary server (mirror redirects would escape
          # the egress allowlist)
          aqt install-qt --base https://download.qt.io/ \
            ${{ matrix.qt_host }} desktop "${QT_VERSION}" ${{ matrix.qt_arch }} \
            -O "${RUNNER_TEMP}/qt"
      - name: Configure Qt environment
        shell: bash
        run: |
          QT_ROOT="${RUNNER_TEMP}/qt/${QT_VERSION}/${{ matrix.qt_dir }}"
          echo "${QT_ROOT}/bin" >> "${GITHUB_PATH}"
          echo "QMAKE=${QT_ROOT}/bin/qmake" >> "${GITHUB_ENV}"
          if [ "${RUNNER_OS}" = "Linux" ]; then
            echo "LD_LIBRARY_PATH=${QT_ROOT}/lib" >> "${GITHUB_ENV}"
          elif [ "${RUNNER_OS}" = "macOS" ]; then
            echo "DYLD_FRAMEWORK_PATH=${QT_ROOT}/lib" >> "${GITHUB_ENV}"
          fi

      - name: Format check
        run: cargo fmt --all --check
      # --all-features: nothing else here compiles automation / memprobe
      # (both off by default); Test compiles the default set.
      # --locked on every cargo here, as in the gate: the graph checked is
      # the committed Cargo.lock.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      # Only the build without the harness can fail to load its QML: a
      # platitude.auto type named in platitude.ui resolves in every other
      # build. No display needed — the command sets QT_QPA_PLATFORM itself.
      - name: Shipped build loads its QML
        run: cargo run --locked -p xtask -- shipped

  # All tests and an offscreen app smoke, inside an empty network namespace
  # (internal-docs/実装計画.md §11.3).
  offline-test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (egress allowlist)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            pypi.org:443
            files.pythonhosted.org:443
            download.qt.io:443
            azure.archive.ubuntu.com:80
            archive.ubuntu.com:80
            security.ubuntu.com:80
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libxkbcommon-dev jq
      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qt
          key: qt-${{ env.QT_VERSION }}-linux_gcc_64
      - name: Install Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          pip install aqtinstall
          aqt install-qt --base https://download.qt.io/ \
            linux desktop "${QT_VERSION}" linux_gcc_64 -O "${RUNNER_TEMP}/qt"
      - name: Configure Qt environment
        run: |
          QT_ROOT="${RUNNER_TEMP}/qt/${QT_VERSION}/gcc_64"
          echo "${QT_ROOT}/bin" >> "${GITHUB_PATH}"
          echo "QMAKE=${QT_ROOT}/bin/qmake" >> "${GITHUB_ENV}"
          echo "LD_LIBRARY_PATH=${QT_ROOT}/lib" >> "${GITHUB_ENV}"

      # Build online, run offline. The smoke needs the harness feature
      # (xtask HARNESS_FEATURE; ci/offline-test.sh).
      - name: Build test binaries and app
        run: |
          cargo build --locked -p platitude-app --features automation
          cargo test --locked --workspace --no-run
      - name: Run tests in an empty network namespace
        run: |
          mapfile -t BINS < <(cargo test --locked --workspace --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true) | .executable | select(. != null)')
          echo "collected ${#BINS[@]} test binaries"
          sudo -E env "PATH=${PATH}" "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" \
            PGG_SMOKE_BIN="$(pwd)/target/debug/platitude-gg" \
            unshare -n bash ci/offline-test.sh "${BINS[@]}"

  deny:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (egress allowlist)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            index.crates.io:443
            static.crates.io:443
      - uses: actions/checkout@v4
      # `check` with no argument runs all four; advisories pull the RustSec DB
      # from github.com.
      - name: cargo-deny (advisories / bans / licenses / sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # The action's default, plus --locked.
          arguments: --all-features --locked
