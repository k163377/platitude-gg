# What a push to main owes CI: the one OS no desk here has. A session's
# git — Claude Code's or Codex's — moves main only onto a commit land's
# gate ran on Windows and in the Linux container, and the session's own
# hook refuses a refspec writing a remote's main (反映前テストの機械化.md
# §git hook), so a push asks macOS alone — clippy and the tests (ci.yml),
# and the verify-ui lines whose verdict the fonts decide (shots.yml, the
# `fonts` tier). The user's own git answers to no gate: a commit they put
# on main by hand ran on no desk, and this run and the whole test are all
# it gets. What the gate's selection let through is the whole test's
# (whole.yml, weekly).
name: Push check (macOS)

# A push that is Markdown alone starts nothing, as it selects no test in
# the gate.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]

permissions:
  contents: read

# The newest push holds every commit the ones before it carried, so a run
# still going when another push lands is cancelled for it. A whole test
# running stops nothing here: land pushes its tags as it lands and main's
# pushes come later, so the two mostly test different commits.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      os: '["macos-26"]'
      whole: false
  shots:
    uses: ./.github/workflows/shots.yml
    with:
      tier: fonts
