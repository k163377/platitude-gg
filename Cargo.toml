[workspace]
resolver = "3"
members = ["crates/platitude-core", "crates/platitude-app", "crates/xtask"]
# A bare `cargo build` builds the product; the task runner is built only
# when invoked (`cargo xtask …`) or with --workspace.
default-members = ["crates/platitude-core", "crates/platitude-app"]
# platitude-core stays Qt-free (`cargo test -p platitude-core` works without
# Qt); building the whole workspace requires a Qt installation because of
# platitude-app. The Phase 0 spike stays excluded (throwaway reference code).
exclude = ["spike"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
platitude-core = { path = "crates/platitude-core" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "time", "sync", "macros", "fs"] }
# Settings/state files. Used through `toml::Table`: per-key fallback
# needs the parsed tree anyway, and leaving the derive aside keeps
# serde_derive/syn out of the build (measured: 14 -> 8 crates, -38KB).
toml = "1"
tokio-util = "0.7"
# Logging only — the `warn!` / `info!` macros. `attributes`, the other
# half of the default, is off: nothing writes `#[instrument]`, so the
# feature's whole content is a proc-macro crate compiled for no caller —
# a cost in build time: nothing of it reaches the binary.
# The first `#[instrument]` means turning it back on.
tracing = { version = "0.1", default-features = false, features = ["std"] }

# **The task runner is optimised even in a debug build.** `cargo xtask`
# runs the dev profile (`.cargo/config.toml`), and xtask is the thing a
# person waits for: the corpus generator alone writes tens of gigabytes
# through a few hundred million integer draws, which unoptimised is most
# of an hour. Only the one package, so nothing else pays the compile
# time.
[profile.dev.package.xtask]
opt-level = 3

# **The hooks build in a directory of their own.** Claude Code's hooks
# and git's reference-transaction hook run the task runner through
# `cargo run --profile hooks` (.claude/settings.json, .githooks/), and
# cargo holds a profile's directory locked for the whole of any build in
# it: a hook built into target/debug waits behind every `cargo test` a
# gate runs in the same tree — a tool call, a prompt, the end of a turn,
# each held for the length of a compile. The same code with its own lock
# (target/hooks), unoptimised because a hook's work is a few file reads
# and the compile is what a session waits for.
[profile.hooks]
inherits = "dev"

[profile.hooks.package.xtask]
opt-level = 0

# **The shipped build has a directory of its own too.** `cargo xtask
# shipped` builds the app without the harness feature and the gate's
# verbs build it with, and in one directory each build replaces the
# other's binary: the verbs' release was relinked twice a gate, and a
# verb starting while `shipped` links would read a binary being replaced.
# In target/shipped the two never meet, so the gate runs `shipped` beside
# its verbs. The release settings unchanged, at the price of one more
# copy of the release build per tree.
[profile.shipped]
inherits = "release"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
disallowed_types = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
too_many_lines = "warn"
