[workspace]
resolver = "3"
members = ["crates/platitude-core", "crates/platitude-app"]
# platitude-core stays Qt-free (`cargo test -p platitude-core` works without
# Qt); building the whole workspace requires a Qt installation because of
# platitude-app. The Phase 0 spike stays excluded (throwaway reference code).
exclude = ["spike"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
platitude-core = { path = "crates/platitude-core" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "time", "sync", "macros"] }
tokio-util = "0.7"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
disallowed_types = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
