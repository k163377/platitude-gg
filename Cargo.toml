[workspace]
resolver = "3"
members = ["crates/platitude-core"]
# The Phase 0 spike is intentionally outside the workspace: it requires Qt at
# build time, while the workspace must stay buildable on machines without Qt.
exclude = ["spike"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
disallowed_types = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
