[workspace]
resolver = "3"
members = ["crates/platitude-core", "crates/platitude-app", "crates/xtask"]
# A bare `cargo build` leaves the task runner out.
default-members = ["crates/platitude-core", "crates/platitude-app"]
# The Phase 0 spike is throwaway reference code.
exclude = ["spike"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
platitude-core = { path = "crates/platitude-core" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "time", "sync", "macros", "fs"] }
# Settings/state files, through `toml::Table` with no derive: per-key
# fallback needs the parsed tree anyway, and serde_derive/syn stay out.
toml = "1"
tokio-util = "0.7"
# `attributes` (default) is off: nothing writes `#[instrument]`, so it is
# a proc-macro crate compiled for no caller. The first one turns it back on.
tracing = { version = "0.1", default-features = false, features = ["std"] }

# The task runner is optimised even in the dev profile `cargo xtask` runs:
# a person waits on it, and the corpus generator makes a few hundred
# million integer draws. Only this package pays the compile.
[profile.dev.package.xtask]
opt-level = 3

# The hooks' own build directory (target/hooks), away from the gate's lock
# on target/debug: 反映前テストの機械化.md §hook は自前の build directory で動く.
# Unoptimised: a hook is a few file reads, and its compile is the wait.
[profile.hooks]
inherits = "dev"

[profile.hooks.package.xtask]
opt-level = 0

# `cargo xtask shipped` in target/shipped, so it never replaces the verbs'
# harness build under them (same doc and §).
[profile.shipped]
inherits = "release"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
disallowed_types = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
too_many_lines = "warn"
